name: Build

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'Jnvp.Platform.slnx'
      - '.github/workflows/build.yml'
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build:
    name: build-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Jnvp.Platform.slnx

      - name: Build
        run: dotnet build Jnvp.Platform.slnx --configuration Release --no-restore
